# Star Wars IMAX 70mm watch
#
# Monitors AMC Lincoln Square 13 for the 50th anniversary re-release of the
# original 1977 Star Wars (opening Feb 19, 2027) in IMAX 70mm and opens a
# GitHub issue when new showtimes appear.
#
# How it works
# ------------
# 1. Every 20 minutes, fetches the theatre's server-rendered showtimes pages
#    for Feb 19-23, 2027 (opening weekend + margin) with a real-browser
#    fingerprint (curl_cffi), which passes AMC's traffic protection where
#    plain requests and headless browsers get blocked.
# 2. Parses showtime links (/showtimes/{id}) under the "IMAX 70MM" format
#    heading for listings whose title matches "star wars".
# 3. Diffs against the committed state.json. Anything unseen -> opens a
#    GitHub issue labeled `new-showtimes` with date/time/booking link.
# 4. First run seeds state silently (no issue).
#
# A separate watcher checks this repo's open issues and alerts in chat, so
# this workflow needs no push-notification secret.

name: star-wars-70mm-watch

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: showtime-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Star Wars IMAX 70mm - opening weekend (Feb 19-23, 2027)
        env:
          ALERT_LABEL: "Star Wars IMAX 70mm - Lincoln Sq"
          MOVIE_PATTERN: "star wars"
          FORMAT_PATTERN: 'imax\s*70'
          SCAN_START: "2027-02-19"
          DAYS_AHEAD: "5"
          EMPTY_STREAK_STOP: "999"
          DATE_URL_TEMPLATE: "https://www.amctheatres.com/movie-theatres/new-york-city/amc-lincoln-square-13/showtimes?date={date}"
          REQUEST_DELAY: "1.5"
          STATE_FILE: state.json
        run: python monitor.py

      - name: Detect new showtimes
        id: detect
        run: |
          python diff_state.py > new_showtimes.json
          count=$(python -c "import json; print(len(json.load(open('new_showtimes.json'))))")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          cat new_showtimes.json

      - name: Open issue for new showtimes
        if: steps.detect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --label new-showtimes --state open --json title --jq '.[].title')
          if [ -n "$existing" ]; then
            echo "An open new-showtimes issue already exists; skipping duplicate."
            exit 0
          fi
          body=$(python -c "
          import json
          shows = json.load(open('new_showtimes.json'))
          lines = []
          for s in shows:
              lines.append(f\"- {s.get('day')} {s.get('time')} — {s.get('movie')} [{s.get('fmt')}] ({s.get('status')})\")
              lines.append(f\"  Book: {s.get('url')}\")
          print('\n'.join(lines))
          ")
          gh issue create \
            --title "Star Wars IMAX 70mm showtimes detected - Lincoln Square" \
            --label new-showtimes \
            --body "New IMAX 70mm showtimes for the 50th anniversary re-release appeared at AMC Lincoln Square 13:

          $body"

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update showtime state [skip ci]"
          git push
